<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (v instanceof Error) return v.stack || (v.name + ': ' + v.message);
        if (typeof v !== 'object' || depth > 3) return String(v);
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>PixelForge Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c2410c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='4' width='18' height='16' rx='2'/><circle cx='8.5' cy='9' r='1.5'/><path d='M3 17l5-5 4 4 5-5 4 4'/></svg>">
  <link rel="stylesheet" href="/styles.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path. Never
       vendor it and never write a hostname in front of it. It is also how the
       app ANSWERS the shell, and where the app learns the viewer's theme. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme, with the OS preference as the
       fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body>
  <div class="workspace" data-workspace>
    <div class="menubar">
      <span class="brand">PixelForge Studio</span>
      <nav class="menus" id="menus" aria-label="Menus"></nav>
      <span class="spacer"></span>
      <button type="button" class="mb-btn" id="undo-btn" data-i18n="undo" title="Ctrl+Z"></button>
      <button type="button" class="mb-btn" id="redo-btn" data-i18n="redo" title="Ctrl+Shift+Z"></button>
      <button type="button" class="mb-btn panels-toggle" id="panels-toggle" data-i18n="panels"></button>
      <button type="button" class="btn-primary" id="export-btn" data-i18n="export"></button>
    </div>
    <div class="doctabs" id="doctabs"></div>
    <div class="optsbar" id="optsbar"></div>
    <div class="main">
      <div class="toolscol" id="toolscol" role="toolbar" aria-label="Tools"></div>
      <div class="stagewrap" id="stagewrap">
        <div class="empty-state" id="empty-state">
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="M3 17l5-5 4 4 5-5 4 4"/></svg>
          <p data-i18n="emptyHint"></p>
          <div class="empty-actions">
            <button type="button" class="btn-primary" id="new-btn" data-i18n="new"></button>
            <button type="button" class="btn-secondary" id="empty-open-btn" data-i18n="open"></button>
          </div>
        </div>
        <div class="stage-inner" id="stage-inner">
          <canvas id="stage-canvas" data-stage-canvas></canvas>
          <canvas id="overlay-canvas"></canvas>
        </div>
        <div class="chip" id="compare-chip" data-i18n="original" hidden></div>
        <div class="crop-ok" id="crop-ok" hidden><button type="button" class="btn-primary" id="crop-apply" data-i18n="applyCrop"></button></div>
      </div>
      <div class="panels" id="panels">
        <div class="ptabs" role="tablist">
          <button type="button" class="pt on" data-ppage="layers" data-i18n="layers"></button>
          <button type="button" class="pt" data-ppage="adjustments" data-i18n="adjustments"></button>
          <button type="button" class="pt" data-ppage="history" data-i18n="history"></button>
          <button type="button" class="pt" data-ppage="color" data-i18n="color"></button>
        </div>
        <div class="ppage on" data-ppage-body="layers">
          <div class="lopts">
            <select id="layer-blend" class="fld-sel" aria-label="Blend mode"></select>
            <input id="layer-opacity" class="fld-num" type="number" min="0" max="100" value="100" aria-label="Opacity %">
          </div>
          <div class="lopts">
            <button type="button" class="mini" id="layer-clip" data-i18n="clip"></button>
            <button type="button" class="mini" id="layer-mask" data-i18n="addMask"></button>
            <button type="button" class="mini" id="layer-dup" data-i18n="duplicate"></button>
            <button type="button" class="mini" id="layer-del" data-i18n="delete"></button>
          </div>
          <div class="list" id="layer-list" role="listbox"></div>
        </div>
        <div class="ppage" data-ppage-body="adjustments">
          <div class="list" id="adj-list"></div>
          <p class="hint" id="adj-hint" data-i18n="adjHint"></p>
        </div>
        <div class="ppage" data-ppage-body="history">
          <div class="list" id="history-list"></div>
          <p class="hint" id="history-note" hidden data-i18n="historyDropped"></p>
        </div>
        <div class="ppage" data-ppage-body="color">
          <div class="cpick">
            <div class="swatch-big" id="fg-swatch"></div>
            <div class="cpick-fields">
              <label class="cpick-row"><span data-i18n="hue"></span><input type="range" id="cp-h" min="0" max="360" value="0"></label>
              <label class="cpick-row"><span data-i18n="saturation"></span><input type="range" id="cp-s" min="0" max="100" value="0"></label>
              <label class="cpick-row"><span data-i18n="value"></span><input type="range" id="cp-v" min="0" max="100" value="100"></label>
              <input type="color" id="cp-native" class="fld-color" aria-label="Color">
            </div>
          </div>
          <h4 class="sect-label" data-i18n="swatches"></h4>
          <div class="swatches" id="swatches"></div>
          <h4 class="sect-label" data-i18n="recentColors"></h4>
          <div class="swatches" id="recent-colors"></div>
        </div>
        <div class="sect">
          <h4 class="sect-label" data-i18n="histogram"></h4>
          <canvas id="histogram" class="hist" width="264" height="64"></canvas>
        </div>
        <div class="sect">
          <h4 class="sect-label" data-i18n="navigator"></h4>
          <canvas id="navigator" class="nav" width="264" height="100"></canvas>
        </div>
      </div>
    </div>
    <div class="statusbar">
      <span id="status-dims"></span>
      <span id="status-zoom"></span>
      <span id="status-autosave"></span>
      <span id="status-msg" role="status"></span>
    </div>
  </div>
  <p class="demo-note" id="demo-note" data-usernode-demo-note hidden>Staging demo: a sample document, not yours</p>
  <div class="menu-pop" id="menu-pop" hidden></div>
  <div class="backdrop" id="backdrop" hidden>
    <div class="dialog" id="dialog-box" role="dialog" aria-modal="true"></div>
  </div>
  <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/svg+xml" hidden>
  <input type="file" id="pfs-input" accept=".pfs" hidden>
  <script src="/i18n.js"></script>
  <script src="/adjust.js"></script>
  <script src="/filters.js"></script>
  <script src="/core.js"></script>
  <script src="/engine.js"></script>
  <script src="/pfs.js"></script>
  <script src="/tools.js"></script>
  <script src="/app.js"></script>
</body>
</html>
